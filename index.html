<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff0f5" />
    <title>Message for Dr.Shahd</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        color: #321b35;
        background: #fff0f5;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 12% 16%, #ffc4d8 0, transparent 34%),
          radial-gradient(ellipse at 88% 82%, #d8c6ff 0, transparent 35%),
          radial-gradient(ellipse at 50% 105%, #ffe1b8 0, transparent 38%),
          #fff0f5;
      }

      main {
        position: relative;
        width: min(100% - 36px, 650px);
        padding: 58px 30px 48px;
        overflow: hidden;
        border: 1px solid #ffffff;
        border-radius: 32px;
        background: #fffdfdcc;
        box-shadow: 0 28px 80px #5521491c, 0 5px 16px #5521490d;
        backdrop-filter: blur(12px);
        text-align: center;
        animation: arrive 700ms ease-out both;
      }

      main::before,
      main::after {
        position: absolute;
        z-index: 0;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: #ffd2e0;
        content: "";
        filter: blur(2px);
        opacity: 0.55;
      }

      main > * {
        position: relative;
        z-index: 1;
      }

      main::before {
        top: -90px;
        left: -74px;
      }

      main::after {
        right: -85px;
        bottom: -96px;
        background: #e3d6ff;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #b51e68;
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 auto;
        max-width: 530px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.15rem, 7vw, 3.8rem);
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 1.12;
      }

      h1 span {
        color: #d52970;
        font-style: italic;
      }

      .hint {
        margin: 20px 0 34px;
        color: #725d70;
        font-size: 0.97rem;
      }

      .gift {
        position: relative;
        display: grid;
        width: min(100%, 290px);
        min-height: 186px;
        margin: 0 auto;
        place-items: center;
        border: 0;
        border-radius: 24px;
        background: linear-gradient(135deg, #ff5578 0%, #e52d78 48%, #9d38c7 100%);
        box-shadow: 0 18px 36px #9d236d40, inset 0 2px 0 #ffffff66;
        color: white;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 220ms ease, box-shadow 220ms ease, background 300ms ease;
      }

      .gift:hover {
        transform: translateY(-5px) rotate(-1deg);
        box-shadow: 0 24px 42px #9d236d55, inset 0 2px 0 #ffffff66;
      }

      .gift:focus-visible {
        outline: 3px solid #64225e;
        outline-offset: 6px;
      }

      .gift:active {
        transform: scale(0.97);
      }

      .gift-lid {
        position: absolute;
        top: 0;
        left: -3%;
        width: 106%;
        height: 39px;
        border-radius: 14px;
        background: linear-gradient(100deg, #f33f70, #d92782);
        box-shadow: inset 0 2px 0 #ffffff52, 0 5px 10px #78184a35;
        transition: transform 550ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .gift-lid::after,
      .gift-ribbon {
        position: absolute;
        top: 0;
        left: 50%;
        width: 25px;
        height: 100%;
        background: #ffe08a;
        content: "";
        transform: translateX(-50%);
      }

      .gift-lid::before {
        position: absolute;
        top: -19px;
        left: 50%;
        width: 50px;
        height: 23px;
        border: 6px solid #ffe08a;
        border-radius: 50% 50% 0 50%;
        content: "";
        transform: translateX(-92%) rotate(-12deg);
      }

      .gift-ribbon {
        top: 39px;
        height: calc(100% - 39px);
        opacity: 0.95;
      }

      .gift-label {
        position: relative;
        z-index: 1;
        padding-top: 21px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.5rem;
        letter-spacing: 0.01em;
        text-shadow: 0 2px 8px #64134166;
        transition: transform 350ms ease, opacity 250ms ease;
      }

      .gift.open {
        background: linear-gradient(135deg, #fb4f73, #d52d86 52%, #8f37be);
      }

      .gift.open .gift-lid {
        transform: translateY(-75px) rotate(-13deg);
      }

      .gift.open .gift-label {
        animation: pop 500ms 180ms both;
        font-size: 2rem;
      }

      .gift.open .gift-ribbon {
        opacity: 0;
      }

      .footer-note {
        margin: 25px 0 0;
        color: #806b7c;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
      }

      .confetti {
        position: fixed;
        z-index: 5;
        top: -14px;
        left: var(--x);
        width: var(--size);
        height: calc(var(--size) * 1.45);
        border-radius: 2px;
        background: var(--color);
        pointer-events: none;
        animation: fall var(--duration) var(--delay) cubic-bezier(0.2, 0.65, 0.35, 1) forwards;
      }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes pop {
        0% { opacity: 0; transform: translateY(10px) scale(0.7); }
        70% { transform: translateY(-5px) scale(1.1); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes fall {
        to {
          transform: translate3d(var(--drift), 110vh, 0) rotate(var(--spin));
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Message for you</p>
      <h1>Hi Shahd, I just wanted to tell you <span>one thing.</span></h1>
      <p class="hint">There's something waiting for you below</p>

      <button class="gift" id="gift" type="button" aria-label="Open the gift box">
        <span class="gift-lid" aria-hidden="true"></span>
        <span class="gift-ribbon" aria-hidden="true"></span>
        <span class="gift-label" id="gift-label">Open me</span>
      </button>
      <p class="footer-note" id="footer-note">Go on, tap the box</p>
    </main>

    <script>
      const gift = document.querySelector("#gift");
      const label = document.querySelector("#gift-label");
      const note = document.querySelector("#footer-note");
      const colors = ["#f5c56b", "#fff1d2", "#d77b84", "#a9c5a0", "#c5a5d6", "#f4a987"];
      let opened = false;

      gift.addEventListener("click", () => {
        if (opened) return;
        opened = true;
        gift.classList.add("open");
        gift.setAttribute("aria-label", "The gift says sorry");
        label.textContent = "sorry";
        note.textContent = "Sorry, Dr.Shahd";
        celebrate();
      });

      function celebrate() {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        for (let index = 0; index < 85; index += 1) {
          const piece = document.createElement("span");
          piece.className = "confetti";
          piece.style.setProperty("--x", `${Math.random() * 100}vw`);
          piece.style.setProperty("--size", `${5 + Math.random() * 7}px`);
          piece.style.setProperty("--color", colors[index % colors.length]);
          piece.style.setProperty("--duration", `${2.2 + Math.random() * 2.2}s`);
          piece.style.setProperty("--delay", `${Math.random() * 0.45}s`);
          piece.style.setProperty("--drift", `${(Math.random() - 0.5) * 220}px`);
          piece.style.setProperty("--spin", `${Math.random() * 900 - 450}deg`);
          piece.addEventListener("animationend", () => piece.remove(), { once: true });
          document.body.append(piece);
        }
      }
    </script>
  </body>
</html>
